<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지장물 검토 및 협의 작업 수행지침서</title>
    <style>
        :root {
            --primary-color: #2563EB;
            --primary-light: #EFF6FF;
            --text-color: #1F2937;
            --bg-color: #F9FAFB;
            --card-bg: #FFFFFF;
            --border-color: #E5E7EB;
            --success-color: #10B981;
            --warning-color: #F59E0B;
        }
        body {
            font-family: 'Inter', '맑은 고딕', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            padding: 40px;
        }
        .header {
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .breadcrumb {
            font-size: 0.85rem;
            color: #6B7280;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .title {
            font-size: 2.0rem;
            color: #111827;
            margin: 0;
            font-weight: 800;
        }
        h2 {
            font-size: 1.3rem;
            color: #111827;
            border-left: 4px solid var(--primary-color);
            padding-left: 12px;
            margin-top: 35px;
            margin-bottom: 15px;
        }
        .intro-box {
            background-color: var(--primary-light);
            color: #1E3A8A;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .bullet-list {
            list-style: none;
            padding-left: 0;
            margin-bottom: 25px;
        }
        .bullet-list li {
            position: relative;
            padding-left: 24px;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
        .bullet-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--primary-color);
            font-weight: 700;
        }
        .bullet-list.numbered li:nth-child(1)::before { content: "1)"; }
        .bullet-list.numbered li:nth-child(2)::before { content: "2)"; }
        .bullet-list.numbered li:nth-child(3)::before { content: "3)"; }
        .bullet-list.numbered li:nth-child(4)::before { content: "4)"; }
        .bullet-list.numbered li:nth-child(5)::before { content: "5)"; }
        .bullet-list.numbered li:nth-child(6)::before { content: "6)"; }
        
        .check-card {
            background-color: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.2s ease;
        }
        .check-card.checked {
            border-color: var(--success-color);
            background-color: #F0FDF4;
        }
        .check-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .check-header input[type="checkbox"] {
            margin-top: 5px;
            width: 18px;
            height: 18px;
            accent-color: var(--success-color);
        }
        .check-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: #111827;
            cursor: pointer;
        }
        .check-card.checked .check-title {
            color: #166534;
            text-decoration: line-through;
        }
        .explanation-box {
            margin-top: 12px;
            padding-left: 30px;
            font-size: 0.9rem;
            color: #4B5563;
        }
        .guide-badge {
            display: inline-block;
            background-color: #FEF3C7;
            color: #92400E;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.75rem;
            margin-bottom: 6px;
        }
        .guide-text {
            background-color: #F9FAFB;
            border: 1px dashed #CBD5E1;
            padding: 12px 16px;
            border-radius: 6px;
            margin-top: 6px;
        }
        .formula {
            font-family: 'Cambria', 'Georgia', serif;
            font-weight: bold;
            color: #B91C1C;
            background-color: #FEE2E2;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 1rem;
        }
        .diagram-container {
            margin: 15px 0;
            text-align: center;
        }
        .diagram-explanation {
            font-size: 0.8rem;
            color: #4B5563;
            margin-top: 6px;
            background-color: #F3F4F6;
            padding: 8px 12px;
            border-radius: 4px;
        }
        .footer-note {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: #9CA3AF;
            text-align: center;
        }
        svg {
            display: block;
            margin: 10px auto 0 auto;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="breadcrumb">Dongtan Tram WBS 지장물 검토 및 협의 Guideline</div>
        <h1 class="title">지장물 검토 및 협의 작업 수행지침서</h1>
    </div>
    
            <h2>2. 작업 수행지침 및 절차</h2>
            <ul class="bullet-list numbered">
                <li><strong>인력 굴착 및 노출</strong>: 중장비 굴착은 관 손상을 초래하므로 지장물 상단 1m 이내는 삽 등을 이용한 인력 굴착만 허용합니다.</li>
                <li><strong>임시 지지 공법</strong>: 굴착으로 공중에 노출된 대형 상수도관이나 하수관은 H-Beam 및 현수 와이어를 이용해 매달기식 공법으로 지지합니다.</li>
            </ul>
            <div class="diagram-container">
                <svg viewBox="0 0 500 180" width="100%" height="180" style="background-color:#F8FAFC; border:1px solid #E2E8F0; border-radius:6px;">
                    <!-- Ground Level -->
                    <line x1="0" y1="50" x2="500" y2="50" stroke="#475569" stroke-width="2"/>
                    <!-- Excavated Pit -->
                    <polygon points="100,50 150,140 350,140 400,50" fill="#F1F5F9" stroke="#94A3B8" stroke-dasharray="3,3"/>
                    <!-- H-Beam across the pit -->
                    <rect x="80" y="35" width="340" height="15" fill="#1E3A8A"/>
                    <text x="250" y="30" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold" fill="#1E3A8A">임시 지지 가설 H-Beam</text>
                    <!-- Suspended Pipe -->
                    <circle cx="250" cy="95" r="20" fill="#EF4444"/>
                    <text x="250" y="130" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold" fill="#B91C1C">노출 지장물 (상수도관/가스관)</text>
                    <!-- Hanger Wire -->
                    <line x1="250" y1="50" x2="250" y2="75" stroke="#10B981" stroke-width="3"/>
                    <text x="260" y="65" font-family="sans-serif" font-size="8" fill="#047857">매달기 와이어</text>
                </svg>
            </div>
            
    <div class="footer-note">
        동탄도시철도(트램) 1공구 엔지니어링 표준서 | 주관: 현장 공사팀
    </div>
</div>
<script>
    function toggleCard(id) {
        const card = document.getElementById('card-' + id);
        const checkbox = document.getElementById('chk-' + id);
        if (checkbox.checked) {
            card.classList.add('checked');
        } else {
            card.classList.remove('checked');
        }
    }
</script>
</body>
</html>
