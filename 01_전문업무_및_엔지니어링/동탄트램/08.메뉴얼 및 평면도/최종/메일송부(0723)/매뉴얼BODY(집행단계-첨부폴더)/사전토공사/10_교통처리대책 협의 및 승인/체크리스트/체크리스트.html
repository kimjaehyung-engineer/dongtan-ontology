<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교통처리대책 협의 및 승인 현장 검측 체크리스트</title>
    <style>
        :root {
            --primary-color: #2563EB;
            --primary-light: #EFF6FF;
            --text-color: #1F2937;
            --bg-color: #F9FAFB;
            --card-bg: #FFFFFF;
            --border-color: #E5E7EB;
            --success-color: #10B981;
            --warning-color: #F59E0B;
        }
        body {
            font-family: 'Inter', '맑은 고딕', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            padding: 40px;
        }
        .header {
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .breadcrumb {
            font-size: 0.85rem;
            color: #6B7280;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .title {
            font-size: 2.0rem;
            color: #111827;
            margin: 0;
            font-weight: 800;
        }
        h2 {
            font-size: 1.3rem;
            color: #111827;
            border-left: 4px solid var(--primary-color);
            padding-left: 12px;
            margin-top: 35px;
            margin-bottom: 15px;
        }
        .intro-box {
            background-color: var(--primary-light);
            color: #1E3A8A;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .bullet-list {
            list-style: none;
            padding-left: 0;
            margin-bottom: 25px;
        }
        .bullet-list li {
            position: relative;
            padding-left: 24px;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
        .bullet-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--primary-color);
            font-weight: 700;
        }
        .bullet-list.numbered li:nth-child(1)::before { content: "1)"; }
        .bullet-list.numbered li:nth-child(2)::before { content: "2)"; }
        .bullet-list.numbered li:nth-child(3)::before { content: "3)"; }
        .bullet-list.numbered li:nth-child(4)::before { content: "4)"; }
        .bullet-list.numbered li:nth-child(5)::before { content: "5)"; }
        .bullet-list.numbered li:nth-child(6)::before { content: "6)"; }
        
        .check-card {
            background-color: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.2s ease;
        }
        .check-card.checked {
            border-color: var(--success-color);
            background-color: #F0FDF4;
        }
        .check-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .check-header input[type="checkbox"] {
            margin-top: 5px;
            width: 18px;
            height: 18px;
            accent-color: var(--success-color);
        }
        .check-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: #111827;
            cursor: pointer;
        }
        .check-card.checked .check-title {
            color: #166534;
            text-decoration: line-through;
        }
        .explanation-box {
            margin-top: 12px;
            padding-left: 30px;
            font-size: 0.9rem;
            color: #4B5563;
        }
        .guide-badge {
            display: inline-block;
            background-color: #FEF3C7;
            color: #92400E;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.75rem;
            margin-bottom: 6px;
        }
        .guide-text {
            background-color: #F9FAFB;
            border: 1px dashed #CBD5E1;
            padding: 12px 16px;
            border-radius: 6px;
            margin-top: 6px;
        }
        .formula {
            font-family: 'Cambria', 'Georgia', serif;
            font-weight: bold;
            color: #B91C1C;
            background-color: #FEE2E2;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 1rem;
        }
        .diagram-container {
            margin: 15px 0;
            text-align: center;
        }
        .diagram-explanation {
            font-size: 0.8rem;
            color: #4B5563;
            margin-top: 6px;
            background-color: #F3F4F6;
            padding: 8px 12px;
            border-radius: 4px;
        }
        .footer-note {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: #9CA3AF;
            text-align: center;
        }
        svg {
            display: block;
            margin: 10px auto 0 auto;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="breadcrumb">Dongtan Tram WBS 교통처리대책 협의 및 승인 Checklist</div>
        <h1 class="title">교통처리대책 협의 및 승인 현장 검측 체크리스트</h1>
    </div>
    
            <h2>3. 검측 체크리스트</h2>
            <div class="check-card" id="card-1">
                <div class="check-header">
                    <input type="checkbox" id="chk-1" onclick="toggleCard(1)">
                    <label for="chk-1" class="check-title">1. 경찰청 교통 소통 심의 의결 결과를 도면에 반영했는가?</label>
                </div>
                <div class="explanation-box">
                    <span class="guide-badge">💡 쉽게 이해하기</span>
                    <div class="guide-text">심의 조치 결과(우회 표지판 추가 등)가 누락되면 시공 중 불시 단속이나 대형 교통 민원이 야기될 수 있습니다.</div>
                </div>
            </div>
            
    <div class="footer-note">
        동탄도시철도(트램) 1공구 엔지니어링 표준서 | 주관: 현장 공사팀
    </div>
</div>
<script>
    function toggleCard(id) {
        const card = document.getElementById('card-' + id);
        const checkbox = document.getElementById('chk-' + id);
        if (checkbox.checked) {
            card.classList.add('checked');
        } else {
            card.classList.remove('checked');
        }
    }
</script>
</body>
</html>
