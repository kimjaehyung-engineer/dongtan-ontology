<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배수 및 환경시설 설치 작업 수행지침서</title>
    <style>
        :root {
            --primary-color: #2563EB;
            --primary-light: #EFF6FF;
            --text-color: #1F2937;
            --bg-color: #F9FAFB;
            --card-bg: #FFFFFF;
            --border-color: #E5E7EB;
            --success-color: #10B981;
            --warning-color: #F59E0B;
        }
        body {
            font-family: 'Inter', '맑은 고딕', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            padding: 40px;
        }
        .header {
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .breadcrumb {
            font-size: 0.85rem;
            color: #6B7280;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .title {
            font-size: 2.0rem;
            color: #111827;
            margin: 0;
            font-weight: 800;
        }
        h2 {
            font-size: 1.3rem;
            color: #111827;
            border-left: 4px solid var(--primary-color);
            padding-left: 12px;
            margin-top: 35px;
            margin-bottom: 15px;
        }
        .intro-box {
            background-color: var(--primary-light);
            color: #1E3A8A;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .bullet-list {
            list-style: none;
            padding-left: 0;
            margin-bottom: 25px;
        }
        .bullet-list li {
            position: relative;
            padding-left: 24px;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
        .bullet-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--primary-color);
            font-weight: 700;
        }
        .bullet-list.numbered li:nth-child(1)::before { content: "1)"; }
        .bullet-list.numbered li:nth-child(2)::before { content: "2)"; }
        .bullet-list.numbered li:nth-child(3)::before { content: "3)"; }
        .bullet-list.numbered li:nth-child(4)::before { content: "4)"; }
        .bullet-list.numbered li:nth-child(5)::before { content: "5)"; }
        .bullet-list.numbered li:nth-child(6)::before { content: "6)"; }
        
        .check-card {
            background-color: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.2s ease;
        }
        .check-card.checked {
            border-color: var(--success-color);
            background-color: #F0FDF4;
        }
        .check-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .check-header input[type="checkbox"] {
            margin-top: 5px;
            width: 18px;
            height: 18px;
            accent-color: var(--success-color);
        }
        .check-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: #111827;
            cursor: pointer;
        }
        .check-card.checked .check-title {
            color: #166534;
            text-decoration: line-through;
        }
        .explanation-box {
            margin-top: 12px;
            padding-left: 30px;
            font-size: 0.9rem;
            color: #4B5563;
        }
        .guide-badge {
            display: inline-block;
            background-color: #FEF3C7;
            color: #92400E;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.75rem;
            margin-bottom: 6px;
        }
        .guide-text {
            background-color: #F9FAFB;
            border: 1px dashed #CBD5E1;
            padding: 12px 16px;
            border-radius: 6px;
            margin-top: 6px;
        }
        .formula {
            font-family: 'Cambria', 'Georgia', serif;
            font-weight: bold;
            color: #B91C1C;
            background-color: #FEE2E2;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 1rem;
        }
        .diagram-container {
            margin: 15px 0;
            text-align: center;
        }
        .diagram-explanation {
            font-size: 0.8rem;
            color: #4B5563;
            margin-top: 6px;
            background-color: #F3F4F6;
            padding: 8px 12px;
            border-radius: 4px;
        }
        .footer-note {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: #9CA3AF;
            text-align: center;
        }
        svg {
            display: block;
            margin: 10px auto 0 auto;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="breadcrumb">Dongtan Tram WBS 배수 및 환경시설 설치 Guideline</div>
        <h1 class="title">배수 및 환경시설 설치 작업 수행지침서</h1>
    </div>
    
            <h2>2. 작업 수행지침 및 절차</h2>
            <ul class="bullet-list numbered">
                <li><strong>법면 보호 비닐</strong>: 장마철 굴착면 사면이 유실되는 것을 막기 위해 사면에 비닐 시트를 덮고 모래주머니로 고정합니다.</li>
                <li><strong>오수 여과 장치</strong>: 임시 침사지 토출부에 필터 천 및 부직포를 2중으로 시공하여 미세 점토질 탁수를 완전 여과합니다.</li>
            </ul>
            <div class="diagram-container">
                <svg viewBox="0 0 500 160" width="100%" height="160" style="background-color:#F8FAFC; border:1px solid #E2E8F0; border-radius:8px;">
                    <!-- Ditch Input -->
                    <rect x="50" y="70" width="120" height="40" fill="#94A3B8" opacity="0.3"/>
                    <text x="110" y="60" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">공사장 가배수로</text>
                    <!-- Settling Basin (침사지) -->
                    <rect x="200" y="50" width="120" height="70" fill="#3B82F6" opacity="0.2" stroke="#3B82F6" stroke-width="2"/>
                    <text x="260" y="40" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#2563EB">임시 침사지 (오수 가두기)</text>
                    <!-- Filter Baffle -->
                    <line x1="320" y1="50" x2="320" y2="120" stroke="#10B981" stroke-width="4"/>
                    <text x="320" y="30" font-family="sans-serif" font-size="8" text-anchor="middle" font-weight="bold" fill="#047857">여과 부직포</text>
                    <!-- Safe Output -->
                    <rect x="360" y="70" width="100" height="40" fill="#38BDF8" opacity="0.3"/>
                    <text x="410" y="60" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold" fill="#0369A1">방류구 (맑은 물)</text>
                </svg>
            </div>
            
    <div class="footer-note">
        동탄도시철도(트램) 1공구 엔지니어링 표준서 | 주관: 현장 공사팀
    </div>
</div>
<script>
    function toggleCard(id) {
        const card = document.getElementById('card-' + id);
        const checkbox = document.getElementById('chk-' + id);
        if (checkbox.checked) {
            card.classList.add('checked');
        } else {
            card.classList.remove('checked');
        }
    }
</script>
</body>
</html>
